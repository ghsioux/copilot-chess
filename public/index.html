<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♟️ Copilot Chess - Battle the AI! 🤖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>♟️ COPILOT CHESS ♟️</h1>
      <p class="subtitle">🤖 Battle Against the AI Overlord 🤖</p>
    </header>

    <div class="game-setup" id="gameSetup">
      <div class="setup-card">
        <h2>🎮 Choose Your Destiny</h2>
        <p class="setup-subtitle">Select a model and prepare for battle!</p>
        
        <div class="model-selector">
          <label for="modelSelect" class="model-label">Choose a model:</label>
          <select id="modelSelect" class="model-select">
            <option value="" disabled selected>Loading models...</option>
          </select>
        </div>

        <button id="startGameBtn" class="start-btn">
          <span>⚔️ START BATTLE ⚔️</span>
        </button>
      </div>
    </div>

    <div class="game-container" id="gameContainer" style="display: none;">
      <div class="game-info">
        <div class="info-panel">
          <div class="status-box">
            <div id="gameStatus" class="game-status-message"></div>
            <div id="turnIndicator" class="turn-indicator">Your turn (White)</div>
          </div>
          
          <div class="difficulty-display">
            <strong>Model:</strong> <span id="currentDifficulty">-</span>
          </div>

          <div class="move-history">
            <h3>📜 Move History</h3>
            <div id="moveHistory" class="moves-list"></div>
          </div>

          <button id="newGameBtn" class="action-btn">
            🔄 New Game
          </button>
          <button id="flipBoardBtn" class="action-btn">
            🔄 Flip Board
          </button>
          <button id="resignBtn" class="action-btn resign-btn">
            🏳️ Resign
          </button>
        </div>
      </div>

      <div class="chess-board-container">
        <div class="captured-pieces-bar ai-captured">
          <div class="captured-label">🤖 AI</div>
          <div id="aiCaptured" class="captured-list"></div>
          <span id="aiMaterialScore" class="material-score"></span>
        </div>
        <div class="board-with-coordinates">
          <div class="coordinates-ranks">
            <span>8</span><span>7</span><span>6</span><span>5</span>
            <span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
          <div id="chessBoard" class="chess-board"></div>
        </div>
        <div class="coordinates-files">
          <span>a</span><span>b</span><span>c</span><span>d</span>
          <span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
        <div class="captured-pieces-bar player-captured">
          <div class="captured-label">👤 You</div>
          <div id="playerCaptured" class="captured-list"></div>
          <span id="playerMaterialScore" class="material-score"></span>
        </div>
      </div>
    </div>

    <footer>
      <p>💻 Powered by Copilot SDK | Made with ❤️ and ☕</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/chess.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
